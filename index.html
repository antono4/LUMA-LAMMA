<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA-LAMMA - Free AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #252532;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .logo-text { font-weight: 700; font-size: 20px; background: linear-gradient(135deg, var(--accent), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-tertiary); border-radius: 20px; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .main { display: flex; flex: 1; }
        .sidebar { width: 280px; background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 20px; }
        .sidebar-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 1px; }
        .model-list { display: flex; flex-direction: column; gap: 8px; }
        .model-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-tertiary); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .model-item:hover { background: rgba(99, 102, 241, 0.1); }
        .model-item.active { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--accent); }
        .model-icon { font-size: 24px; }
        .model-info { flex: 1; }
        .model-name { font-weight: 500; font-size: 14px; }
        .model-size { font-size: 12px; color: var(--text-muted); }
        .model-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); }
        .model-item.active .model-check { background: var(--accent); border-color: var(--accent); }
        .chat-area { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 20px; }
        .chat-messages { flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .welcome-message { text-align: center; padding: 40px 20px; }
        .welcome-icon { font-size: 64px; margin-bottom: 20px; }
        .welcome-message h2 { font-size: 28px; margin-bottom: 12px; }
        .welcome-message p { color: var(--text-secondary); max-width: 500px; margin: 0 auto 24px; }
        .api-section { background: var(--bg-secondary); border-radius: 16px; padding: 20px; margin: 20px auto; max-width: 500px; text-align: left; }
        .api-section h3 { margin-bottom: 12px; font-size: 16px; }
        .api-section p { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
        .api-links { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .api-link { padding: 12px; background: var(--bg-tertiary); border-radius: 8px; color: var(--accent-light); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .api-link:hover { background: var(--bg-primary); }
        .api-input { width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        .api-select { width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; margin-bottom: 10px; box-sizing: border-box; cursor: pointer; }
        .api-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; font-weight: 500; }
        .api-btn:hover { background: var(--accent-light); }
        .quick-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .quick-btn { padding: 10px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); cursor: pointer; transition: all 0.2s; }
        .quick-btn:hover { background: var(--accent); border-color: var(--accent); }
        .message { display: flex; gap: 12px; margin-bottom: 20px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .message.user .message-avatar { background: var(--accent); }
        .message-content { max-width: 70%; padding: 12px 16px; background: var(--bg-secondary); border-radius: 16px; border-top-left-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
        .message.user .message-content { background: var(--accent); border-radius: 16px; border-top-right-radius: 4px; }
        .message.error .message-content { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--error); }
        .typing-indicator { display: none; padding: 20px; }
        .typing-indicator.active { display: flex; gap: 12px; }
        .typing-dots { display: flex; gap: 4px; padding: 12px 16px; background: var(--bg-secondary); border-radius: 16px; }
        .typing-dot { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
        .chat-input-container { padding: 20px 0; }
        .chat-input-wrapper { display: flex; gap: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 8px; }
        .chat-input { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 15px; padding: 8px 12px; resize: none; max-height: 150px; font-family: inherit; }
        .chat-input:focus { outline: none; }
        .send-btn { width: 44px; height: 44px; background: var(--accent); border: none; border-radius: 12px; color: white; font-size: 20px; cursor: pointer; transition: all 0.2s; }
        .send-btn:hover { background: var(--accent-light); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { text-align: center; padding: 16px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); }
        .footer a { color: var(--accent-light); text-decoration: none; }
        @media (max-width: 768px) { .sidebar { display: none; } .message-content { max-width: 85%; } }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo-text">💬 LUMA-LAMMA</div>
            <div class="status-badge"><span class="status-dot"></span><span>Ready</span></div>
        </header>
        <main class="main">
            <aside class="sidebar">
                <div class="sidebar-title">Select Model</div>
                <div class="model-list" id="model-list"></div>
            </aside>
            <section class="chat-area">
                <div class="chat-messages" id="chat-messages">
                    <div class="welcome-message" id="welcome-message">
                        <div class="welcome-icon">💬</div>
                        <h2>Welcome to LUMA-LAMMA</h2>
                        <p>Free AI chat with OpenRouter! Enter your API key below.</p>
                        
                        <div class="api-section">
                            <h3>🔑 Get Free API Key</h3>
                            <a href="https://openrouter.ai/keys" target="_blank" class="api-link">🌐 OpenRouter - Get Free Key</a>
                            
                            <h3>Enter Your OpenRouter API Key</h3>
                            <input type="password" class="api-input" id="api-key-input" placeholder="sk-or-v1-...">
                            <button class="api-btn" onclick="saveAPIKey()">Save & Start Chatting</button>
                        </div>
                        
                        <div class="quick-actions">
                            <button class="quick-btn" onclick="sendSuggestion('Hello!')">👋 Hello</button>
                            <button class="quick-btn" onclick="sendSuggestion('Explain quantum computing')">🔬 Explain</button>
                            <button class="quick-btn" onclick="sendSuggestion('Write Python hello world')">💻 Code</button>
                        </div>
                    </div>
                </div>
                <div class="typing-indicator" id="typing-indicator">
                    <div class="message-avatar">🤖</div>
                    <div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
                </div>
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea class="chat-input" id="chat-input" placeholder="Type your message..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            Powered by <a href="https://openrouter.ai" target="_blank">OpenRouter</a> | <a href="https://github.com/antono4/LUMA-LAMMA" target="_blank">LUMA-LAMMA</a>
        </footer>
    </div>
    <script>
        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';

        const MODELS = [
            { id: 'openrouter/free', name: '🎲 Auto (Best Free)', icon: '🎲', desc: 'Auto-select best free model' },
            { id: 'qwen/qwen3-coder:free', name: 'Qwen Coder', icon: '💻', desc: 'Coding assistant' },
            { id: 'liquid/lfm-2.5-1.2b-thinking:free', name: 'Liquid Thinking', icon: '🧠', desc: 'Reasoning model' },
            { id: 'cognitivecomputations/dolphin-mistral-24b-venice-edition:free', name: 'Dolphin Mistral', icon: '🐬', desc: 'Creative AI' },
            { id: 'google/gemma-4-26b-a4b-it:free', name: 'Gemma 4 26B', icon: '💎', desc: 'Google AI' },
            { id: 'nvidia/nemotron-nano-9b-v2:free', name: 'Nemotron Nano', icon: '⚡', desc: 'NVIDIA AI' }
        ];

        let selectedModel = MODELS[0];
        let conversationHistory = [];
        let isLoading = false;

        function init() {
            renderModels();
        }

        function saveAPIKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key && key.startsWith('sk-or-v1-')) {
                localStorage.setItem('api_key', key);
                document.getElementById('welcome-message').style.display = 'none';
                addMessage('assistant', '✅ API Key saved! Select a model and start chatting.');
            } else {
                alert('Please enter a valid OpenRouter API key (starts with sk-or-v1-)');
            }
        }

        function renderModels() {
            const list = document.getElementById('model-list');
            list.innerHTML = '';
            MODELS.forEach(model => {
                const isActive = model.id === selectedModel.id;
                const item = document.createElement('div');
                item.className = 'model-item' + (isActive ? ' active' : '');
                item.innerHTML = '<div class="model-icon">' + model.icon + '</div><div class="model-info"><div class="model-name">' + model.name + '</div><div class="model-size">' + model.desc + '</div></div><div class="model-check"></div>';
                item.onclick = function() { selectModel(model); };
                list.appendChild(item);
            });
        }

        function selectModel(model) {
            selectedModel = model;
            document.querySelectorAll('.model-item').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function sendSuggestion(text) {
            const key = localStorage.getItem('api_key');
            if (!key) {
                document.getElementById('api-key-input').focus();
                return;
            }
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('api_key');
            if (!apiKey) {
                document.getElementById('api-key-input').focus();
                return;
            }

            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || isLoading) return;

            input.value = '';
            autoResize(input);
            document.getElementById('welcome-message').style.display = 'none';

            addMessage('user', message);
            conversationHistory.push({ role: 'user', content: message });

            showTyping(true);
            isLoading = true;
            document.getElementById('send-btn').disabled = true;

            try {
                const messages = conversationHistory.map(m => ({ role: m.role, content: m.content }));

                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': 'https://github.com/antono4/LUMA-LAMMA',
                        'X-Title': 'LUMA-LAMMA'
                    },
                    body: JSON.stringify({ model: selectedModel.id, messages: messages })
                });

                const data = await res.json();

                if (res.status === 401 || res.status === 403) {
                    addMessage('assistant', '❌ Invalid API Key. Please get a valid key from openrouter.ai/keys', true);
                } else if (data.error) {
                    addMessage('assistant', '❌ ' + (data.error.message || 'Error occurred'), true);
                } else {
                    const response = data.choices[0].message.content;
                    addMessage('assistant', response);
                    conversationHistory.push({ role: 'assistant', content: response });
                }
            } catch (err) {
                addMessage('assistant', '❌ Connection error. Check your internet.', true);
            } finally {
                showTyping(false);
                isLoading = false;
                document.getElementById('send-btn').disabled = false;
            }
        }

        function addMessage(role, content, isError = false) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'message ' + role + (isError ? ' error' : '');
            div.innerHTML = '<div class="message-avatar">' + (role === 'user' ? '👤' : '🤖') + '</div><div class="message-content">' + escapeHtml(content) + '</div>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping(show) { document.getElementById('typing-indicator').classList.toggle('active', show); }
        function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        init();
    </script>
</body>
</html>

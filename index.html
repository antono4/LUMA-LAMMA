<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA-LAMMA - Free AI Chat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-tertiary: #27272a;
            --bg-hover: #3f3f46;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-hover: #7c3aed;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-secondary);
        }
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), #ec4899);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .logo-text {
            font-weight: 700; font-size: 18px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-badge {
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            color: var(--success);
            font-size: 12px; font-weight: 500;
        }
        .status-badge.loading {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--warning);
            color: var(--warning);
        }
        .status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            color: var(--error);
        }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 280px; background: var(--bg-primary);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-header h3 {
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); margin-bottom: 12px;
        }
        .provider-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .provider-tab {
            flex: 1; padding: 8px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-secondary);
            font-size: 11px; font-weight: 500;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .provider-tab:hover { background: var(--bg-tertiary); }
        .provider-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
        .model-select {
            width: 100%; padding: 10px 14px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-primary);
            font-size: 13px; cursor: pointer;
        }
        .model-select:focus { outline: none; border-color: var(--accent); }
        .model-select option { background: var(--bg-secondary); }
        .models-info { padding: 16px; flex: 1; overflow-y: auto; }
        .models-info h4 { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .model-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; background: var(--bg-secondary);
            border-radius: 8px; margin-bottom: 6px;
            font-size: 12px; color: var(--text-secondary);
        }
        .model-item .check { color: var(--success); }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
        .clear-chat-btn {
            width: 100%; padding: 10px; background: transparent;
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-secondary); font-size: 13px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }
        .clear-chat-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
        .welcome {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 40px;
        }
        .welcome-icon { font-size: 72px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .welcome h1 {
            font-size: 32px; font-weight: 700; margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p { color: var(--text-secondary); font-size: 16px; max-width: 500px; margin-bottom: 32px; }
        .welcome-features { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        .welcome-feature {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 20px; background: var(--bg-tertiary);
            border-radius: 12px; font-size: 14px; color: var(--text-secondary);
        }
        .message {
            display: flex; gap: 16px; margin-bottom: 24px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message-avatar {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .message.user .message-avatar { background: linear-gradient(135deg, var(--accent), #ec4899); }
        .message.assistant .message-avatar { background: var(--bg-tertiary); }
        .message-content { max-width: 75%; }
        .message.user .message-content { text-align: right; }
        .message-bubble {
            padding: 14px 18px; border-radius: 16px;
            font-size: 14px; line-height: 1.7; word-wrap: break-word;
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white; border-bottom-right-radius: 4px;
        }
        .message.assistant .message-bubble {
            background: var(--bg-tertiary); border-bottom-left-radius: 4px;
        }
        .message.error .message-bubble {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error); color: var(--error);
            white-space: pre-wrap;
        }
        .message-bubble pre {
            background: var(--bg-primary); padding: 16px;
            border-radius: 8px; overflow-x: auto; margin: 12px 0;
            text-align: left;
        }
        .message-bubble code {
            font-family: 'Fira Code', 'Monaco', monospace;
            background: var(--bg-primary); padding: 2px 6px; border-radius: 4px;
            font-size: 13px;
        }
        .message-bubble pre code { background: transparent; padding: 0; }
        .message-bubble p { margin-bottom: 8px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble ul, .message-bubble ol { margin: 8px 0; padding-left: 24px; text-align: left; }
        .message-bubble strong { font-weight: 600; }
        .input-area {
            padding: 16px 24px 24px; background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            display: flex; gap: 12px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 16px; padding: 6px;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        .input-wrapper textarea {
            flex: 1; background: transparent; border: none;
            color: var(--text-primary); font-size: 14px; font-family: inherit;
            padding: 10px 12px; resize: none;
            min-height: 44px; max-height: 150px; line-height: 1.5;
        }
        .input-wrapper textarea:focus { outline: none; }
        .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .send-btn {
            width: 44px; height: 44px; background: var(--accent);
            border: none; border-radius: 12px; color: white;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-bar {
            display: flex; align-items: center; justify-content: center;
            padding: 8px; background: var(--bg-primary);
            border-top: 1px solid var(--border);
            font-size: 12px; color: var(--text-muted);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-muted); margin-right: 6px;
        }
        .status-dot.ready { background: var(--success); }
        .status-dot.error { background: var(--error); }
        .status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .welcome h1 { font-size: 24px; }
            .welcome-features { flex-direction: column; gap: 12px; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🦙</div>
                <span class="logo-text">LUMA-LAMMA</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="clear-chat-btn" onclick="showApiKeyModal()" style="padding: 6px 12px; font-size: 12px;">
                    🔑 <span id="api-key-status">Set API Key</span>
                </button>
                <span class="status-badge" id="status-badge">✨ 100% Free!</span>
            </div>
        </header>
        
        <!-- API Key Modal -->
        <div id="api-key-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: var(--bg-secondary); padding: 24px; border-radius: 16px; max-width: 500px; width: 90%; border: 1px solid var(--border);">
                <h3 style="margin-bottom: 8px;">🔑 Set Groq API Key</h3>
                <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 16px;">
                    Get free API key from <a href="https://console.groq.com/keys" target="_blank" style="color: var(--accent-light);">console.groq.com</a> (FREE!)
                </p>
                <input type="password" id="api-key-input" placeholder="Paste your API key here..." 
                    style="width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; margin-bottom: 12px;">
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button onclick="hideApiKeyModal()" class="clear-chat-btn" style="padding: 8px 16px;">Cancel</button>
                    <button onclick="saveApiKey()" style="padding: 8px 16px; background: var(--accent); border: none; border-radius: 8px; color: white; cursor: pointer;">Save</button>
                </div>
            </div>
        </div>

        <main class="main">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Provider</h3>
                    <div class="provider-tabs">
                        <button class="provider-tab active" data-provider="groq">Groq</button>
                        <button class="provider-tab" data-provider="ollama">Ollama</button>
                    </div>
                    <h3 style="margin-top: 16px;">Model</h3>
                    <select class="model-select" id="model-select"></select>
                </div>
                <div class="models-info">
                    <h4>ℹ️ Info</h4>
                    <div class="model-item"><span class="check">✓</span><span>Groq: Ultra fast inference</span></div>
                    <div class="model-item"><span>🖥️</span><span>Ollama: Run locally</span></div>
                    <div class="model-item"><span>💰</span><span>No API key needed!</span></div>
                </div>
                <div class="sidebar-footer">
                    <button class="clear-chat-btn" onclick="clearChat()">
                        <span>🗑️</span><span>Clear Chat</span>
                    </button>
                </div>
            </aside>

            <section class="chat-area">
                <div class="chat-container" id="chat-container">
                    <div class="welcome" id="welcome">
                        <div class="welcome-icon">🦙</div>
                        <h1>Welcome to LUMA-LAMMA</h1>
                        <p>Free AI Chat - Pilih model dan mulai chat!</p>
                        <div class="welcome-features">
                            <div class="welcome-feature"><span>💰</span> 100% Free</div>
                            <div class="welcome-feature"><span>⚡</span> Fast</div>
                            <div class="welcome-feature"><span>🔒</span> Private</div>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea id="message-input" placeholder="Ketik pesan..." rows="1"></textarea>
                        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>

                <div class="status-bar">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Ready</span>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Configuration
        const API_BASE = ''; // Same origin
        
        // State
        let currentProvider = 'groq';
        let selectedModel = null;
        let history = [];
        let isLoading = false;
        let apiKey = localStorage.getItem('groq_api_key') || '';

        // Providers data
        const PROVIDERS = {
            groq: {
                name: 'Groq (Free)',
                models: [
                    { id: 'llama-3.3-70b-versatile', name: 'Llama 3.3 70B', icon: '🦙' },
                    { id: 'llama-3.1-8b-instant', name: 'Llama 3.1 8B', icon: '🦙' },
                    { id: 'mixtral-8x7b-32768', name: 'Mixtral 8x7B', icon: '🌀' },
                    { id: 'gemma2-9b-it', name: 'Gemma 2 9B', icon: '💎' },
                ]
            },
            ollama: {
                name: 'Ollama (Local)',
                models: [
                    { id: 'llama3.2', name: 'Llama 3.2', icon: '🦙' },
                    { id: 'llama3', name: 'Llama 3', icon: '🦙' },
                    { id: 'mistral', name: 'Mistral 7B', icon: '🌬️' },
                    { id: 'phi3', name: 'Phi-3', icon: '📘' },
                    { id: 'qwen2.5', name: 'Qwen 2.5', icon: '🔮' },
                    { id: 'gemma2', name: 'Gemma 2', icon: '💎' },
                    { id: 'codellama', name: 'Code Llama', icon: '💻' },
                ]
            }
        };

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const welcome = document.getElementById('welcome');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusBadge = document.getElementById('status-badge');
        const modelSelect = document.getElementById('model-select');

        function init() {
            renderModels();
            setupEventListeners();
            updateApiKeyStatus();
        }

        function updateApiKeyStatus() {
            const statusEl = document.getElementById('api-key-status');
            if (apiKey) {
                statusEl.textContent = 'API Key Set ✓';
                updateStatus('ready', 'Ready - Type a message!');
            } else {
                statusEl.textContent = 'Set API Key';
                updateStatus('error', 'API Key required');
            }
        }

        function showApiKeyModal() {
            document.getElementById('api-key-modal').style.display = 'flex';
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('api-key-input').focus();
        }

        function hideApiKeyModal() {
            document.getElementById('api-key-modal').style.display = 'none';
        }

        function saveApiKey() {
            const input = document.getElementById('api-key-input');
            apiKey = input.value.trim();
            
            if (apiKey) {
                localStorage.setItem('groq_api_key', apiKey);
                updateApiKeyStatus();
                hideApiKeyModal();
            }
        }

        function setupEventListeners() {
            // Provider tabs
            document.querySelectorAll('.provider-tab').forEach(tab => {
                tab.addEventListener('click', () => switchProvider(tab.dataset.provider));
            });

            // Model select
            modelSelect.addEventListener('change', (e) => {
                const provider = PROVIDERS[currentProvider];
                selectedModel = provider.models.find(m => m.id === e.target.value);
            });

            // Auto-resize textarea
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
            });

            // Enter to send
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        function switchProvider(provider) {
            currentProvider = provider;
            
            // Update tabs
            document.querySelectorAll('.provider-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.provider === provider);
            });
            
            // Re-render models
            renderModels();
            
            updateStatus('ready', `${PROVIDERS[provider].name} Ready`);
        }

        function renderModels() {
            const provider = PROVIDERS[currentProvider];
            modelSelect.innerHTML = provider.models.map(m => 
                `<option value="${m.id}">${m.icon} ${m.name}</option>`
            ).join('');
            
            // Set first model as selected
            selectedModel = provider.models[0];
        }

        function updateStatus(status, text) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = text;
            
            statusBadge.classList.remove('loading', 'error');
            if (status === 'loading') {
                statusBadge.textContent = '⏳ Processing...';
                statusBadge.classList.add('loading');
            } else if (status === 'error') {
                statusBadge.textContent = '❌ Error';
                statusBadge.classList.add('error');
            } else {
                statusBadge.textContent = '✨ 100% Free!';
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isLoading || !selectedModel) {
                if (!selectedModel) {
                    addMessage('error', '❌ Please select a model first!');
                }
                return;
            }

            // Check API key for Groq
            if (currentProvider === 'groq' && !apiKey) {
                addMessage('error', '❌ Please set your Groq API key first!\n\nClick the "Set API Key" button in the header.');
                showApiKeyModal();
                return;
            }

            welcome.style.display = 'none';
            addMessage('user', text);
            history.push({ role: 'user', content: text });
            messageInput.value = '';
            messageInput.style.height = 'auto';

            updateStatus('loading', 'AI is thinking...');
            isLoading = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: currentProvider,
                        model: selectedModel.id,
                        message: text,
                        history: history.slice(0, -1),
                        apiKey: currentProvider === 'groq' ? apiKey : undefined
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                history.push({ role: 'assistant', content: data.response });
                addMessage('assistant', data.response);
                updateStatus('ready', `${PROVIDERS[currentProvider].name} Ready`);
                
            } catch (error) {
                console.error('Chat error:', error);
                addMessage('error', '❌ Error: ' + error.message);
                updateStatus('error', 'Error occurred');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const avatar = role === 'user' ? '👤' : role === 'error' ? '⚠️' : '🤖';
            
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-bubble">${formatMessage(content)}</div>
                </div>
            `;

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatMessage(text) {
            if (!text) return '';
            
            // Escape HTML first
            let formatted = escapeHtml(text);
            
            // Code blocks (must be before inline code)
            formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Inline code
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Italic
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            
            // Line breaks
            formatted = formatted.replace(/\n/g, '<br>');
            
            return formatted;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearChat() {
            history = [];
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcome);
            welcome.style.display = 'flex';
            updateStatus('ready', 'Chat cleared');
        }

        // Initialize
        init();
    </script>
</body>
</html>

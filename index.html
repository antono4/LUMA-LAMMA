<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA-LAMMA - Free AI Chat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-tertiary: #1a1a24;
            --bg-hover: #22222e;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
        
        /* API Setup Modal */
        .api-setup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .api-setup-content {
            background: var(--bg-tertiary);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        
        .api-setup-content h3 {
            margin-bottom: 12px;
        }
        
        .api-setup-content p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .api-setup-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        
        .api-setup-content button {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
        }
        
        .api-setup-content .close-btn {
            background: var(--bg-hover);
        }
        
        .api-key-status {
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .api-key-status:hover {
            background: var(--bg-hover);
        }
        
        /* Header */
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .logo-text {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .model-selector:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }
        
        .model-selector select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            padding-right: 20px;
        }
        
        .model-selector select:focus {
            outline: none;
        }
        
        .model-selector select option {
            background: var(--bg-secondary);
        }
        
        .provider-selector {
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }
        
        .provider-selector:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Chat Messages */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 3px;
        }
        
        /* Welcome Screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }
        
        .welcome-icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .welcome h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            max-width: 400px;
            margin-bottom: 32px;
        }
        
        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
        }
        
        .suggestion-btn {
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .suggestion-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .suggestion-btn .icon {
            font-size: 16px;
            margin-right: 8px;
        }
        
        /* Messages */
        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
        }
        
        .message-content {
            max-width: 85%;
            min-width: 200px;
        }
        
        .message.user .message-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .message-bubble {
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border-top-left-radius: 4px;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .message.user .message-bubble {
            background: var(--accent);
            border-radius: 16px;
            border-top-right-radius: 4px;
            color: white;
        }
        
        .message.error .message-bubble {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
        }
        
        /* Markdown Content */
        .markdown-content {
            color: var(--text-primary);
        }
        
        .markdown-content > *:first-child {
            margin-top: 0;
        }
        
        .markdown-content > *:last-child {
            margin-bottom: 0;
        }
        
        .markdown-content h1, 
        .markdown-content h2, 
        .markdown-content h3,
        .markdown-content h4 {
            margin: 20px 0 12px 0;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .markdown-content h1 { font-size: 20px; }
        .markdown-content h2 { font-size: 17px; }
        .markdown-content h3 { font-size: 15px; }
        
        .markdown-content p {
            margin: 12px 0;
        }
        
        .markdown-content table {
            border-collapse: collapse;
            margin: 16px 0;
            width: 100%;
            font-size: 13px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .markdown-content th, 
        .markdown-content td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
        }
        
        .markdown-content th {
            background: rgba(99, 102, 241, 0.15);
            font-weight: 600;
        }
        
        .markdown-content tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .markdown-content code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: #f472b6;
        }
        
        .markdown-content pre {
            background: #0d0d12;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 14px 0;
            overflow: hidden;
        }
        
        .markdown-content pre code {
            display: block;
            padding: 16px;
            background: transparent;
            color: #e4e4e7;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
        }
        
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .copy-btn {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .copy-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .copy-btn.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        
        .markdown-content ul,
        .markdown-content ol {
            padding-left: 24px;
            margin: 12px 0;
        }
        
        .markdown-content li {
            margin: 6px 0;
        }
        
        .markdown-content blockquote {
            border-left: 3px solid var(--accent);
            padding: 8px 16px;
            margin: 14px 0;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }
        
        .markdown-content blockquote p {
            margin: 0;
        }
        
        .markdown-content a {
            color: var(--accent-light);
            text-decoration: none;
        }
        
        .markdown-content a:hover {
            text-decoration: underline;
        }
        
        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }
        
        .markdown-content strong {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .markdown-content em {
            font-style: italic;
            color: var(--text-secondary);
        }
        
        .markdown-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 12px 0;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        
        .typing-indicator.active {
            display: flex;
        }
        
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border-top-left-radius: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        
        /* Input Area */
        .input-container {
            padding: 16px 20px 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            transition: all 0.2s;
        }
        
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 10px 12px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.5;
        }
        
        .chat-input::placeholder {
            color: var(--text-muted);
        }
        
        .chat-input:focus {
            outline: none;
        }
        
        .send-btn {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }
        
        .status-dot.warning { background: var(--warning); }
        .status-dot.error { background: var(--error); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .app {
                border: none;
            }
            
            .suggestions {
                grid-template-columns: 1fr;
            }
            
            .message-content {
                max-width: 90%;
            }
            
            .header {
                padding: 12px 16px;
            }
            
            .chat-container {
                padding: 16px;
            }
            
            .input-container {
                padding: 12px 16px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">💬</div>
                    <span class="logo-text">LUMA-LAMMA</span>
                </div>
            </div>
            <div class="header-right">
                <div class="model-selector">
                    <span>🐆</span>
                    <select id="model-select" onchange="changeModel(this.value)"></select>
                </div>
                <select id="provider-select" class="provider-selector" onchange="switchProvider(this.value)">
                    <option value="groq">⚡ Groq</option>
                    <option value="openrouter">🌐 OpenRouter</option>
                </select>
                <span class="api-key-status" onclick="showApiSetup(currentProvider)" title="Click to change API key">🔑</span>
            </div>
        </header>
        
        <!-- API Key Setup -->
        <div class="api-setup" id="api-setup" style="display: none;">
            <div class="api-setup-content">
                <h3>🔑 Setup API Key</h3>
                <p>Enter your API key to use <span id="setup-provider-name"></span></p>
                <input type="password" id="api-key-input" placeholder="Enter API key..." />
                <button onclick="saveApiKey()">Save & Connect</button>
                <button onclick="closeApiSetup()" class="close-btn">Cancel</button>
            </div>
        </div>
        
        <div class="chat-container" id="chat-container">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🐆</div>
                <h1>Hello! I'm LUMA-LAMMA</h1>
                <p>Your free AI assistant powered by advanced language models. How can I help you today?</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendSuggestion('Explain quantum computing in simple terms')">
                        <span class="icon">⚛️</span> Explain quantum computing
                    </button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Write a Python function to sort a list')">
                        <span class="icon">🐍</span> Write Python code
                    </button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Help me brainstorm ideas for a startup')">
                        <span class="icon">💡</span> Brainstorm startup ideas
                    </button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Summarize the key points of machine learning')">
                        <span class="icon">🧠</span> ML fundamentals
                    </button>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing">
            <div class="message-avatar">🐆</div>
            <div class="typing-bubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    class="chat-input" 
                    id="chat-input" 
                    placeholder="Type your message..."
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Ready</span>
            <span>•</span>
            <span>Powered by OpenRouter</span>
        </div>
    </div>

    <script>
        // Configure marked with error handling
        marked.use({
            breaks: true,
            gfm: true
        });
        
        // Custom renderer for code blocks
        const renderer = {
            code(code, language) {
                const validLang = language && hljs.getLanguage(language) ? language : 'plaintext';
                const highlighted = hljs.highlight(code || '', { language: validLang }).value;
                return `<pre>
                    <div class="code-header">
                        <span>${validLang}</span>
                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                    </div>
                    <code class="hljs language-${validLang}">${highlighted}</code>
                </pre>`;
            }
        };
        
        marked.use({ renderer });
        
        // Providers Configuration
        const PROVIDERS = {
            openrouter: {
                name: 'OpenRouter',
                icon: '🌐',
                endpoint: 'https://openrouter.ai/api/v1/chat/completions',
                apiKey: atob('c2stb3ItdjEtZjZhZDQ2NDdmMTM5MjNlMTRjNjYxNTI1Njk2NDQ5ZGQzMzcyYjMyNTE4NjhhODNlZDkzNTM4NWQxYWMzN2NiZA=='),
                header: 'Authorization',
                extraHeaders: { 'HTTP-Referer': 'https://github.com/antono4/LUMA-LAMMA', 'X-Title': 'LUMA-LAMMA' },
                models: [
                    { id: 'openrouter/free', name: '🎲 Auto (Best Free)', desc: 'Auto-select best model' },
                    { id: 'nvidia/nemotron-3-super-120b-a12b:free', name: '⚡ Nemotron 120B', desc: 'NVIDIA fast & smart' },
                    { id: 'meta-llama/llama-3.3-70b-instruct:free', name: '🦙 Llama 3.3 70B', desc: 'Meta powerful' },
                    { id: 'google/gemma-4-26b-a4b-it:free', name: '💎 Gemma 4 26B', desc: 'Google AI' },
                    { id: 'qwen/qwen3-next-80b-a3b-instruct:free', name: '🌊 Qwen3 80B', desc: 'Alibaba strong' },
                    { id: 'cognitivecomputations/dolphin-mistral-24b-venice-edition:free', name: '🐬 Dolphin 24B', desc: 'Mistral based' },
                    { id: 'nvidia/nemotron-nano-9b-v2:free', name: '🔬 Nemotron Nano', desc: 'NVIDIA small fast' },
                    { id: 'poolside/laguna-xs.2:free', name: '🏊 Poolside XS', desc: 'Poolside AI' },
                    { id: 'liquid/lfm-2.5-1.2b-thinking:free', name: '🧠 Liquid Thinking', desc: 'Reasoning model' }
                ]
            },
            groq: {
                name: 'Groq',
                icon: '⚡',
                endpoint: 'https://api.groq.com/openai/v1/chat/completions',
                apiKey: '',
                header: 'Authorization',
                models: [
                    { id: 'llama-3.3-70b-versatile', name: '🦙 Llama 3.3 70B', desc: 'Fast & powerful' },
                    { id: 'llama-3.1-8b-instant', name: '⚡ Llama 3.1 8B', desc: 'Very fast' },
                    { id: 'mixtral-8x7b-32768', name: '🌪️ Mixtral 8x7B', desc: 'Fast MoE' },
                    { id: 'gemma2-9b-it', name: '💎 Gemma 2 9B', desc: 'Google fast' }
                ]
            }
        };

        let currentProvider = 'groq';
        let selectedModel = PROVIDERS.groq.models[0];
        let history = [];
        let loading = false;

        function init() { 
            // Default OpenRouter key (base64 encoded)
            const defaultKeys = {
                openrouter: atob('c2stb3ItdjEtZjZhZDQ2NDdmMTM5MjNlMTRjNjYxNTI1Njk2NDQ5ZGQzMzcyYjMyNTE4NjhhODNlZDkzNTM4NWQxYWMzN2NiZA==')
            };
            
            // Load stored keys or use defaults
            for (let p in PROVIDERS) {
                const storedKey = localStorage.getItem(`api_key_${p}`);
                if (storedKey) {
                    PROVIDERS[p].apiKey = storedKey;
                } else if (defaultKeys[p]) {
                    PROVIDERS[p].apiKey = defaultKeys[p];
                }
            }
            
            renderModels(); 
            updateStatus('ready', 'Ready');
            document.getElementById('provider-select').value = currentProvider;
        }

        function getApiKey(provider) {
            return localStorage.getItem(`api_key_${provider}`) || PROVIDERS[provider].apiKey || '';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return alert('Please enter an API key');
            localStorage.setItem(`api_key_${currentProvider}`, key);
            PROVIDERS[currentProvider].apiKey = key;
            closeApiSetup();
            updateStatus('ready', `${PROVIDERS[currentProvider].name} Ready`);
        }

        function closeApiSetup() {
            document.getElementById('api-setup').style.display = 'none';
        }

        function showApiSetup(provider) {
            document.getElementById('setup-provider-name').textContent = PROVIDERS[provider].name;
            document.getElementById('api-key-input').value = getApiKey(provider);
            document.getElementById('api-setup').style.display = 'flex';
        }

        function renderModels() {
            const select = document.getElementById('model-select');
            select.innerHTML = '';
            PROVIDERS[currentProvider].models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.name}`;
                if (m.id === selectedModel.id) opt.selected = true;
                select.appendChild(opt);
            });
            updateStatus('ready', `${PROVIDERS[currentProvider].name} Ready`);
        }

        function switchProvider(key) {
            const savedKey = getApiKey(key);
            if (!savedKey && PROVIDERS[key].apiKey === 'YOUR_API_KEY') {
                showApiSetup(key);
                document.getElementById('provider-select').value = currentProvider;
                return;
            }
            currentProvider = key;
            selectedModel = PROVIDERS[key].models[0];
            if (savedKey) PROVIDERS[key].apiKey = savedKey;
            history = [];
            document.getElementById('chat-container').innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🐆</div>
                    <h1>Hello! I'm LUMA-LAMMA</h1>
                    <p>Your free AI assistant powered by advanced language models. How can I help you today?</p>
                    <div class="suggestions">
                        <button class="suggestion-btn" onclick="sendSuggestion('Explain quantum computing in simple terms')">
                            <span class="icon">⚛️</span> Explain quantum computing
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Write a Python function to sort a list')">
                            <span class="icon">🐍</span> Write Python code
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Help me brainstorm ideas for a startup')">
                            <span class="icon">💡</span> Brainstorm startup ideas
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Summarize the key points of machine learning')">
                            <span class="icon">🧠</span> ML fundamentals
                        </button>
                    </div>
                </div>
            `;
            renderModels();
            updateStatus('ready', `${PROVIDERS[key].name} Ready`);
        }

        function changeModel(modelId) {
            const model = PROVIDERS[currentProvider].models.find(m => m.id === modelId);
            if (model) {
                selectedModel = model;
            }
        }

        function updateStatus(type, msg = '') {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = 'status-dot';
            if (type === 'ready') {
                text.textContent = msg || 'Ready';
            } else if (type === 'loading') {
                dot.className = 'status-dot warning';
                text.textContent = 'Thinking...';
            } else if (type === 'error') {
                dot.className = 'status-dot error';
                text.textContent = 'Error';
            }
        }

        function sendSuggestion(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }
        
        function copyCode(btn) {
            const pre = btn.closest('pre');
            const code = pre.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || loading) return;
            
            input.value = '';
            autoResize(input);
            
            // Remove welcome screen if present
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            
            addMsg('user', text);
            history.push({ role: 'user', content: text });
            showTyping(true);
            updateStatus('loading');
            loading = true;
            document.getElementById('send-btn').disabled = true;
            
            try {
                const p = PROVIDERS[currentProvider];
                let res, data;
                
                if (currentProvider === 'google') {
                    const apiKey = getApiKey(currentProvider);
                    res = await fetch(`${p.endpoint}/${selectedModel.id}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    const response = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
                    addMsg('assistant', response);
                    history.push({ role: 'model', content: response });
                } else {
                    const apiKey = getApiKey(currentProvider);
                    const headers = { 'Content-Type': 'application/json' };
                    headers[p.header] = `Bearer ${apiKey}`;
                    if (p.extraHeaders) Object.assign(headers, p.extraHeaders);
                    
                    res = await fetch(p.endpoint, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ 
                            model: selectedModel.id, 
                            messages: history.map(m => ({ role: m.role, content: m.content })) 
                        })
                    });
                    data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                    const response = data.choices?.[0]?.message?.content || 'No response';
                    addMsg('assistant', response);
                    history.push({ role: 'assistant', content: response });
                }
                updateStatus('ready', `${PROVIDERS[currentProvider].name} Ready`);
            } catch (err) {
                addMsg('assistant', '❌ **Error:** ' + err.message, true);
                updateStatus('error');
            } finally {
                showTyping(false);
                loading = false;
                document.getElementById('send-btn').disabled = false;
            }
        }

        function addMsg(role, content, isError = false) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message ' + role + (isError ? ' error' : '');
            
            const avatar = role === 'user' ? '👤' : '🐆';
            
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-bubble ${role === 'assistant' && !isError ? 'markdown-content' : ''}"></div>
                </div>
            `;
            
            const msgBubble = div.querySelector('.message-bubble');
            
            if (role === 'user' || isError) {
                msgBubble.textContent = content;
            } else {
                try {
                    // Ensure content is a string
                    const textContent = String(content || '');
                    if (textContent.trim()) {
                        const rawHtml = marked.parse(textContent);
                        msgBubble.innerHTML = DOMPurify.sanitize(rawHtml);
                    } else {
                        msgBubble.textContent = 'No response';
                    }
                } catch (err) {
                    console.error('Markdown parsing error:', err);
                    msgBubble.textContent = content;
                }
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping(show) { 
            document.getElementById('typing').classList.toggle('active', show); 
        }
        
        function handleKey(e) { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(); 
            } 
        }
        
        function autoResize(el) { 
            el.style.height = 'auto'; 
            el.style.height = Math.min(el.scrollHeight, 120) + 'px'; 
        }

        init();
    </script>
</body>
</html>
